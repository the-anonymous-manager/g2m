# Deploys g2m.life to Cloudflare Workers on every push to main. Mirrors how Vercel used to
# auto-deploy from main: push the code, the site updates on its own, no manual `npm run cf:deploy`
# needed. Also fires after the hourly sheet-sync workflow finishes: GitHub does not let a push made
# with the sheet-sync workflow's own token trigger another workflow's `on: push` (an anti-loop
# safeguard), so sheet-sync's commits need this separate `workflow_run` trigger to reach the site.
name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ['Sync cards from Google Sheet']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cf-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Plausible analytics (see .env.example). Not secret: this script URL is sent to every visitor's
          # browser anyway. The pa-... name is Akash's account-specific script, set up to dodge ad blockers.
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: g2m.life
          NEXT_PUBLIC_PLAUSIBLE_SRC: https://plausible.io/js/pa-WcftlX-0STlMYebFEU4nW.js
        run: npm run cf:deploy

      - name: Close the problem report
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label cf-deploy --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "The next deploy went through. g2m.life is up to date."
          done

      - name: Report the problem
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The latest push did **not** go live on g2m.life. The site still shows the previous version."
            echo
            echo "Details are in the run log: $RUN_URL"
            echo
            echo "This closes itself once a deploy succeeds again."
          } > issue.md
          gh label create cf-deploy --color B76E79 --description "Cloudflare deploy problems" --force
          n=$(gh issue list --label cf-deploy --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file issue.md
          else
            gh issue create --title "Deploy to g2m.life failed" --label cf-deploy --body-file issue.md
          fi
