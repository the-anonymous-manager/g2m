# Deploys g2m.life to Cloudflare Workers on every push to main. Mirrors how Vercel used to
# auto-deploy from main: push the code, the site updates on its own, no manual `npm run cf:deploy`
# needed. Also fires after the hourly sheet-sync workflow finishes: GitHub does not let a push made
# with the sheet-sync workflow's own token trigger another workflow's `on: push` (an anti-loop
# safeguard), so sheet-sync's commits need this separate `workflow_run` trigger to reach the site.
name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ['Sync cards from Google Sheet']
    types: [completed]
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: 'Send every page to Bing (IndexNow), not only the changed ones'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: cf-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # github.sha is the newest commit on main for every trigger, including the sheet sync's own commit. (The sync
          # run's head_sha is the commit it started from, so building that left sheet edits off the site until the next
          # code push.)
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      # The live sitemap before this deploy, so the IndexNow step can tell which pages are new or changed.
      - name: Save the current sitemap
        run: curl -sf --max-time 30 https://g2m.life/sitemap.xml -o "$RUNNER_TEMP/sitemap-before.xml" || true

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Plausible was switched off on 29 Oct 2026 (paid after the trial). To turn it back on, set
          # NEXT_PUBLIC_PLAUSIBLE_DOMAIN (and NEXT_PUBLIC_PLAUSIBLE_SRC) here; see .env.example.
        run: npm run cf:deploy

      # Tells Bing which pages changed (scripts/indexnow.mjs). Never fails the deploy.
      - name: Tell Bing about changed pages
        continue-on-error: true
        run: |
          if [ "${{ inputs.indexnow_all }}" = "true" ]; then
            node scripts/indexnow.mjs --all .next/server/app/sitemap.xml.body
          else
            node scripts/indexnow.mjs "$RUNNER_TEMP/sitemap-before.xml" .next/server/app/sitemap.xml.body
          fi

      - name: Close the problem report
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label cf-deploy --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "The next deploy went through. g2m.life is up to date."
          done

      - name: Report the problem
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The latest push did **not** go live on g2m.life. The site still shows the previous version."
            echo
            echo "Details are in the run log: $RUN_URL"
            echo
            echo "This closes itself once a deploy succeeds again."
          } > issue.md
          gh label create cf-deploy --color B76E79 --description "Cloudflare deploy problems" --force
          n=$(gh issue list --label cf-deploy --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file issue.md
          else
            gh issue create --title "Deploy to g2m.life failed" --label cf-deploy --body-file issue.md
          fi
